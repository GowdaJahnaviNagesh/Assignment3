<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4 reset-card">
            <h3 class="text-center mb-4">Reset Password</h3>
            <form action="index.html">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="input-group">
                        <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required>
                        <span class="input-group-text" onclick="togglePassword('newPassword', this)">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
                        <span class="input-group-text" onclick="togglePassword('confirmPassword', this)">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    Update Password
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="index.html">Back to Login</a>
            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(fieldId, icon) {
            let input = document.getElementById(fieldId);
            let iconElement = icon.querySelector("i");

            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.remove("bi-eye");
                iconElement.classList.add("bi-eye-slash");
            } else {
                input.type = "password";
                iconElement.classList.remove("bi-eye-slash");
                iconElement.classList.add("bi-eye");
            }
        }
    </script>
</body>
</html>
